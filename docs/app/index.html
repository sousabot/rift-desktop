<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rift.lol — Stats</title>
    <meta name="description" content="Link your Riot account, browse tier lists, and climb the leaderboards on Rift.lol." />
    <meta name="theme-color" content="#0b0e16" />
    <link rel="icon" href="./icon.png" />
    <link rel="preconnect" href="https://gd-desktop.onrender.com" crossorigin />
    <link rel="dns-prefetch" href="https://gd-desktop.onrender.com" />
    <link rel="preload" href="./meta/tierlist-euw1-master.json" as="fetch" crossorigin />
    <link rel="preload" href="./meta/leaderboard-euw1-challenger.json" as="fetch" crossorigin />
    <link rel="preload" href="./meta/esports-ladder.json" as="fetch" crossorigin />
    <script>
      // Wake the API while the JS bundle loads (Render cold start).
      // If a Riot ID is linked, prefetch light recent-games and seed local cache.
      try {
        var API = 'https://gd-desktop.onrender.com';
        fetch(API + '/v1/web/tierlist?platform=euw1&rank=master', {
          mode: 'cors',
          credentials: 'omit',
        }).catch(function () {});
        fetch(API + '/v1/web/leaderboard?tier=challenger&platform=euw1&mode=soloq&limit=5', {
          mode: 'cors',
          credentials: 'omit',
        }).then(function (res) { return res.ok ? res.json() : null; }).then(function (data) {
          if (!data || !Array.isArray(data.entries) || !data.entries.length) return;
          data._cachedAt = Date.now();
          try {
            localStorage.setItem('rift.lb.v1:euw1|challenger|soloq', JSON.stringify(data));
          } catch (err) {}
        }).catch(function () {});
        fetch(API + '/v1/web/pros', {
          mode: 'cors',
          credentials: 'omit',
        }).then(function (res) { return res.ok ? res.json() : null; }).then(function (data) {
          if (!data || !Array.isArray(data.players) || !data.players.length) return;
          data._cachedAt = Date.now();
          try {
            localStorage.setItem('rift.pros.v1:|||', JSON.stringify(data));
            var keys = JSON.parse(localStorage.getItem('rift.pros.v1.keys') || '[]').filter(function (x) {
              return x !== '|||';
            });
            keys.unshift('|||');
            localStorage.setItem('rift.pros.v1.keys', JSON.stringify(keys.slice(0, 8)));
          } catch (err) {}
        }).catch(function () {});
        var session = JSON.parse(localStorage.getItem('rift-web-session') || 'null');
        if (session && session.gameName && session.tagLine) {
          var platform = session.platform || 'euw1';
          var q = new URLSearchParams({
            gameName: session.gameName,
            tagLine: session.tagLine,
            platform: platform,
            mode: 'Solo',
            count: '5',
            light: '1',
          });
          if (session.region) q.set('region', session.region);
          var cacheKey = [
            String(session.gameName).trim().toLowerCase(),
            String(session.tagLine).trim().toLowerCase(),
            String(platform).toLowerCase(),
            'Solo',
            'L',
          ].join('|');
          fetch(API + '/v1/web/dashboard?' + q.toString(), {
            mode: 'cors',
            credentials: 'omit',
          }).then(function (res) { return res.ok ? res.json() : null; }).then(function (data) {
            if (!data || !Array.isArray(data.recentGames)) return;
            data._cachedAt = Date.now();
            data.light = true;
            try {
              localStorage.setItem('rift.dash.v1:' + cacheKey, JSON.stringify(data));
              var keys = JSON.parse(localStorage.getItem('rift.dash.v1.keys') || '[]').filter(function (x) {
                return x !== cacheKey;
              });
              keys.unshift(cacheKey);
              localStorage.setItem('rift.dash.v1.keys', JSON.stringify(keys.slice(0, 6)));
            } catch (err) {}
          }).catch(function () {});
        }
      } catch (e) {}
    </script>
    <script type="module" crossorigin src="./assets/index-CtLcIwJo.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-esOpgXTZ.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
